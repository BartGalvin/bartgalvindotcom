# Install after obtaining this certificate. Keep TLS keys outside the site tree.
server {
    listen 80;
    listen [::]:80;
    server_name bartgalvin.com www.bartgalvin.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bartgalvin.com www.bartgalvin.com;
    ssl_certificate /etc/letsencrypt/live/bartgalvin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bartgalvin.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/bartgalvin/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    location ~* ^/(src|deploy|node_modules)(/|$) {
        return 404;
    }

    location ~* (\.(env|key|pem|log|map|bak|old|orig|save|swp)|~)$ {
        return 404;
    }

    location ~* ^/package(-lock)?\.json$ {
        return 404;
    }

    location /assets/ {
        alias /var/www/bartgalvin/shared/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /version.txt {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
